<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join SkillSwap</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <div class="logo">
            Skill<span>Swap</span>
        </div>

        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="explore.html">Explore Skills</a></li>
                <li><a href="how-it-works.html">How It Works</a></li>
            </ul>
        </nav>

        <div class="nav-buttons">
            <a href="login.html" class="login-btn">Login</a>
            <a href="signup.html" class="signup-btn">Join Now</a>
        </div>

    </header>


    <!-- Sign Up Section -->
    <main class="auth-page">

        <div class="auth-container signup-container">

            <div class="auth-header">

                <div class="auth-icon">✨</div>

                <h1>Join SkillSwap</h1>

                <p>
                    Create your account and start exchanging skills.
                </p>

            </div>


            <form class="auth-form">

                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirm your password"
                        required
                    >
                </div>


                <div class="form-group">

                    <label for="skill">
                        Skill You Can Teach
                    </label>

                    <input
                        type="text"
                        id="skill"
                        placeholder="Example: Java, Python, Photoshop"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="learn">
                        Skill You Want to Learn
                    </label>

                    <input
                        type="text"
                        id="learn"
                        placeholder="Example: UI Design, Web Development"
                        required
                    >

                </div>


                <label class="terms">

                    <input type="checkbox" required>

                    I agree to the SkillSwap terms and conditions.

                </label>


                <button type="submit" class="auth-btn">
                    Create Account
                </button>

            </form>


            <p class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        <div class="footer-bottom">
            <p>© 2026 SkillSwap. All rights reserved.</p>
        </div>

    </footer>
<script src="js/script.js" defer></script>
</body>
</html>
